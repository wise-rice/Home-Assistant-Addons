name: "Airplay 2 for Home Assistant - wise_rice"
description: "Adds Airplay 2 capabilities to Home Assistant"
url: https://github.com/wise-rice/Home-Assistant-Addons/tree/main/Airplay2
version: "0.0.1.4"
slug: "airplay2"
init: false
arch:
  - aarch64
  - amd64
  - armv7
boot: "auto"
host_network: true
audio: true
options:
  airplay_name: "Hass.io"
  offset: "-0.25"
  interpolation: "auto"
  default_airplay_volume: "-24.0"
  volume_control_combined_hardware_priority: "no"
  output_backend: "pa"
  enabled: "no"
  mqtt_host: "core-mosquitto"
  mqtt_username: "user"
  mqtt_password: "password"
  mqtt_publish_cover: "no"
schema:
  airplay_name: str
  offset: str
  interpolation: str
  enabled: str
  mqtt_host: str
  mqtt_username: str
  mqtt_password: password
  mqtt_publish_cover: str
image: "wise-rice/ha-airplay2-{arch}-debian"
