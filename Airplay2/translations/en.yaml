configuration:
  airplay_name:
    name: Airplay Name
    description: >-
      The Name that will show up on your iOS device. 
  offset:
    name: Playback offset
    description: >-
      Can be used to adjust syncing issues, can also be set to negative values.
  interpolation:
    name: Interpolation
    description: >-
      Leave on "auto" or check the Shairport-sync docs for more info. Alternatives are "basic" or "soxr". Choose "soxr" only if you have a reasonably fast x86 processor (otherwise, there might be problems with the buffer, so no sound or dropouts). "soxr" might not work on ARM processors. 

  enabled:
    name: Enable MQTT
    description: >-
      Set to "no" to disable MQTT, and to "yes" to enable it.
  mqtt_publish_cover:
    name: MQTT publish cover
    description: >-
      When set to yes, it allows MQTT to transmit the cover (might lead to more load on the MQTT broker)
